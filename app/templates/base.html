<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}SCF PROPEG{% endblock %}</title>
    <style>
        :root {
            --navy: #2B3A55;
            --accent: #4F46E5;
            --accent-soft: #EEF0FF;
            --ink: #1E293B;
            --muted: #64748B;
            --border: #E2E8F0;
            --danger: #DC2626;
            --danger-soft: #FEF2F2;
            --success: #16A34A;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top left, #EEF0FF 0%, #F7F8FC 45%, #EAF0FB 100%);
            color: var(--ink);
        }
        .auth-card {
            background: #fff;
            width: 380px;
            max-width: 90vw;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(43,58,85,0.12);
            padding: 36px 32px 32px;
        }
        .auth-brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom: 4px; }
        .auth-brand .logo {
            width: 42px; height: 42px; border-radius: 10px;
            background: #fff; border: 1px solid var(--border);
            display:flex; align-items:center; justify-content:center;
            overflow: hidden; padding: 3px; flex-shrink: 0;
        }
        .auth-brand .logo img { width: 100%; height: 100%; object-fit: contain; }
        .auth-brand-text { line-height: 1.2; }
        .auth-brand span { font-weight: 700; font-size: 15px; color: var(--navy); display: block; }
        .auth-brand small { font-size: 11px; color: var(--muted); display: block; }
        h2 { text-align:center; font-size: 20px; margin: 22px 0 22px 0; color: var(--navy); }
        .flash { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
        .flash.erro { background: var(--danger-soft); color: var(--danger); }
        .flash.sucesso { background: #ECFDF5; color: var(--success); }
        label { display: block; margin-top: 14px; font-weight: 600; font-size: 13px; color: var(--ink); }
        input { width: 100%; padding: 10px 12px; margin-top: 5px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
        input:focus { outline: none; border-color: var(--accent); }
        button { width:100%; margin-top: 22px; padding: 11px 16px; background: var(--accent); color: white; border: none; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
        button:disabled { opacity: 0.65; cursor: not-allowed; }
        .erros-campo { color: var(--danger); font-size: 12px; margin-top: 4px; }
        .auth-links { text-align: center; margin-top: 16px; font-size: 13px; }
        .auth-links a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .checkbox-row { display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13px; }
        .checkbox-row input { width:auto; margin-top:0; }

        .btn-link-secundario {
            display: inline-block; text-decoration: none; padding: 9px 18px; border-radius: 999px;
            background: #fff; color: var(--ink); border: 1px solid var(--border);
            font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .btn-link-secundario:hover { background: #F1F5F9; }
        .btn-link-primario {
            display: inline-block; text-decoration: none; padding: 10px 22px; border-radius: 999px;
            background: var(--accent); color: #fff; border: none;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .btn-link-primario:hover { background: #4338CA; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-brand">
        <div class="logo">
            <img src="{{ url_for('static', filename='img/ufac-logo.png') }}" alt="Logo UFAC">
        </div>
        <div class="auth-brand-text">
            <span>SCF PROPEG</span>
            <small>UFAC — Pró-Reitoria de Pesquisa</small>
        </div>
    </div>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <div class="flash {{ categoria }}">{{ mensagem }}</div>
        {% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
</div>

<script>
    document.querySelectorAll('form').forEach(function (form) {
        form.addEventListener('submit', function () {
            var botoes = form.querySelectorAll('button:not([type="button"])');
            botoes.forEach(function (botao) {
                if (botao.disabled) return;
                botao.disabled = true;
                botao.textContent = 'Enviando...';
            });
        });
    });
</script>
</body>
</html>
