<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}SCF PROPEG{% endblock %}</title>
    <style>
        :root {
            --navy: #2B3A55;
            --accent: #4F46E5;
            --accent-soft: #EEF0FF;
            --ink: #1E293B;
            --muted: #64748B;
            --border: #E2E8F0;
            --danger: #DC2626;
            --danger-soft: #FEF2F2;
            --success: #16A34A;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top left, #EEF0FF 0%, #F7F8FC 45%, #EAF0FB 100%);
            color: var(--ink);
        }
        .auth-card {
            background: #fff;
            width: 380px;
            max-width: 90vw;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(43,58,85,0.12);
            padding: 36px 32px 32px;
        }
        .auth-brand { display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom: 22px; }
        .auth-brand .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); display:flex; align-items:center; justify-content:center; }
        .auth-brand span { font-weight: 700; font-size: 15px; color: var(--navy); }
        h2 { text-align:center; font-size: 20px; margin: 0 0 22px 0; color: var(--navy); }
        .flash { padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; }
        .flash.erro { background: var(--danger-soft); color: var(--danger); }
        .flash.sucesso { background: #ECFDF5; color: var(--success); }
        label { display: block; margin-top: 14px; font-weight: 600; font-size: 13px; color: var(--ink); }
        input { width: 100%; padding: 10px 12px; margin-top: 5px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }
        input:focus { outline: none; border-color: var(--accent); }
        button { width:100%; margin-top: 22px; padding: 11px 16px; background: var(--accent); color: white; border: none; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .erros-campo { color: var(--danger); font-size: 12px; margin-top: 4px; }
        .auth-links { text-align: center; margin-top: 16px; font-size: 13px; }
        .auth-links a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .checkbox-row { display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13px; }
        .checkbox-row input { width:auto; margin-top:0; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-brand">
        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="#4F46E5" stroke-width="2"/><path d="M8 12h8M8 8h8M8 16h5" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span>Sistema de Controle Financeiro</span>
    </div>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <div class="flash {{ categoria }}">{{ mensagem }}</div>
        {% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
</div>
</body>
</html>
